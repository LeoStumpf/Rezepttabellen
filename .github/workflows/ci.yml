# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks, builds and signs Rezepttabellen on every push to main, every pull
# request and on demand. Mirrors the ZoneCraft pipeline.
#
#   1. type checks (npm run check) and tests (npm test)
#   2. web build without server defaults (no .env file), Capacitor sync, and the
#      signed Android release: APK + App Bundle (AAB) for Google Play, kept as
#      artifact rezepttabellen-release-<sha> for 30 days
#   3. on a tag v<versionName>: a GitHub release with the APK as
#      Rezepttabellen-<versionName>.apk and the notes from
#      fastlane/metadata/android/en-US/changelogs/<versionCode>.txt
#
# Three repository secrets make the release build the installable one:
#   ANDROID_KEYSTORE_BASE64    <- ~/rezepttabellen-upload-keystore.jks, base64
#   ANDROID_KEYSTORE_PASSWORD  <- android/key.properties (storePassword)
#   ANDROID_KEY_PASSWORD       <- android/key.properties (keyPassword)
# The alias `upload` is a literal, not a secret: GitHub masks every occurrence
# of a secret's value in the log. A fork's pull request sees no secrets; the
# release build then falls back to the debug key and is only a smoke test.
# Never switch this to `pull_request_target`.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access only to publish the release on a tag.
    permissions:
      contents: write
    # The `secrets` context cannot be read in a step's `if:`; an env var can.
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version
        run: |
          code="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)"
          name="$(sed -n 's/^ *versionName "\(.*\)".*/\1/p' android/app/build.gradle)"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName $name, versionCode $code"

      # A release tag must name the version it ships, and come with notes.
      - name: Release tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "!!! tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME" >&2
            exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ ! -s "$notes" ]; then echo "!!! $notes is missing or empty" >&2; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Type checks
        run: npm run check

      - name: Tests
        run: npm test

      # No web/.env.android.local here: the published APK carries no server
      # address or password; users enter their own in the app's settings.
      - name: Web build and Capacitor sync
        run: |
          npm -w web run build -- --mode android
          npx cap sync android

      # Materialise what android/app/build.gradle reads; storeFile resolves
      # relative to android/app. Both files are gitignored and live only here.
      - name: Release signing
        if: env.HAVE_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties

      - name: Release APK and App Bundle (AAB)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Signed with the upload key, not debug
        if: env.HAVE_KEYSTORE != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          desc="$("$apksigner" verify --print-certs "$apk")"
          echo "$desc" | grep -E 'DN:|SHA-256' || true
          if [ -z "$desc" ]; then echo "!!! no signing certificate" >&2; exit 1; fi
          if echo "$desc" | grep -q 'CN=Android Debug'; then echo "!!! signed with the debug key" >&2; exit 1; fi
          aab=android/app/build/outputs/bundle/release/app-release.aab
          cert="$(keytool -printcert -jarfile "$aab")"
          echo "$cert" | grep -E 'Owner:|SHA256:' || true
          if [ -z "$cert" ] || echo "$cert" | grep -q 'Not a signed jar'; then echo "!!! bundle not signed" >&2; exit 1; fi
          if echo "$cert" | grep -q 'CN=Android Debug'; then echo "!!! bundle signed with the debug key" >&2; exit 1; fi

      - name: Name the builds after their version
        if: env.HAVE_KEYSTORE != ''
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Rezepttabellen-$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Rezepttabellen-$VERSION_NAME-$VERSION_CODE.aab"

      - name: Keep the signed build
        if: env.HAVE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: rezepttabellen-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Only the APK goes into the release; the AAB stays in the artifact for Play.
      - name: Publish the GitHub release
        if: env.HAVE_KEYSTORE != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Rezepttabellen $VERSION_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            --verify-tag

      - name: Remove the key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
